[project]
name = "reflect"
version = "0.1.0"
description = "Self-reflective agent: generate -> judge -> critique -> regenerate, with a measured judge-vs-groundtruth calibration"
requires-python = ">=3.11"
authors = [
    { name = "Shanmukha Sai Sumanth Yenneti", email = "shanmukha.yenneti@gmail.com" }
]
dependencies = [
    "ollama>=0.4.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "click>=8.1",
    "rich>=13.7",
    "matplotlib>=3.9",
]

[project.scripts]
reflect = "reflect.cli:main"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
timeout = 120
markers = [
    "integration: live tests that call a real Ollama server (slow, requires local model).",
]

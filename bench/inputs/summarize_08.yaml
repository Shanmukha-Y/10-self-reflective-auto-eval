input_text: A national park service study tracking wolf reintroduction over 15 years found that elk populations
  in the study area declined by 60%, while beaver dam counts increased roughly fourfold over the same
  period. Researchers attribute the beaver increase to elk spending less time grazing along streambanks,
  allowing willow and aspen saplings -- beaver food sources -- to recover. The study describes this as
  an example of a trophic cascade but notes that drought conditions during the same period may also have
  contributed to vegetation changes.

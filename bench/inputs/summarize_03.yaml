input_text: Researchers at a materials science lab developed a new battery electrolyte that retains 94%
  of its capacity after 2,000 charge cycles, compared to roughly 80% for standard lithium-ion electrolytes
  tested under identical conditions. The gain comes from a polymer additive that reduces dendrite formation
  on the anode. The electrolyte was tested only in coin-cell prototypes so far; the team says scaling
  to full battery packs and confirming manufacturing cost are the next steps before any commercial application.
  No timeline for commercialization was given.

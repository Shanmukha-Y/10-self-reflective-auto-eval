input_text: The city council voted 6-3 on Tuesday to approve a $40 million bond measure for repairing
  the downtown water main system, which has caused twelve major breaks in the past two years. The bonds
  will be repaid over 20 years through a small increase in water utility bills, adding roughly $4 per
  household per month starting next fiscal year. Council members who opposed the measure argued the city
  should have pursued state infrastructure grants first. Construction is expected to begin in the spring
  and take approximately 18 months, with work concentrated on Main Street and the surrounding four-block
  business district.

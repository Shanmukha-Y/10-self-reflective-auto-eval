id: codegen_09
domain: codegen
title: Merge two sorted lists
instructions: Write a Python function that merges two already-sorted lists of integers into one sorted
  list, without using the built-in sorted() function.
rubric_name: codegen
code:
  function_name: merge_sorted
  starter_signature: 'def merge_sorted(a: list[int], b: list[int]) -> list[int]:'
  test_asserts:
  - assert merge_sorted([1, 3, 5], [2, 4, 6]) == [1, 2, 3, 4, 5, 6]
  - assert merge_sorted([], []) == []
  - assert merge_sorted([1, 2], []) == [1, 2]
  - assert merge_sorted([], [1, 2]) == [1, 2]
  - assert merge_sorted([1, 1, 2], [1, 3]) == [1, 1, 1, 2, 3]

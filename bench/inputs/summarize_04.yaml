input_text: A regional airline announced it will cut 15% of its domestic routes starting next quarter,
  citing rising fuel costs and a pilot shortage that has forced it to ground six aircraft. The affected
  routes are mostly short regional hops between smaller airports, while major hub-to-hub routes are unaffected.
  The airline said roughly 200 employees, mostly ground crew at the smaller airports, will be offered
  relocation or severance. Competing carriers have not announced plans to add service on the dropped routes.
